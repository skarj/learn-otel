apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-gateway
  labels:
    app: frontend-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-gateway
  template:
    metadata:
      labels:
        app: frontend-gateway
    spec:
      containers:
        - name: frontend-gateway
          image: ghcr.io/skarj/frontend-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: frontend-gateway
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8000
            - name: ORDER_SERVICE_URL
              value: http://order-service:8000
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
