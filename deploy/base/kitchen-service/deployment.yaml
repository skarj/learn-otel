apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-service
  labels:
    app: kitchen-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kitchen-service
  template:
    metadata:
      labels:
        app: kitchen-service
    spec:
      containers:
        - name: kitchen-service
          image: ghcr.io/skarj/kitchen-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: kitchen-service
            - name: NATS_URL
              value: nats://nats:4222
            - name: ORDER_SERVICE_URL
              value: http://order-service:8000
            - name: OTLP_ENDPOINT
              value: "http://signoz-otel-collector.observability.svc.cluster.local:4317"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
