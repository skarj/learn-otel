name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read # pull the source code
  packages: write # push the Docker image

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend-gateway:
              - 'libs/common/**'
              - 'services/frontend-gateway/**'
            catalog-service:
              - 'libs/common/**'
              - 'services/catalog-service/**'
            order-service:
              - 'libs/common/**'
              - 'services/order-service/**'
            pricing-service:
              - 'libs/common/**'
              - 'services/pricing-service/**'
            kitchen-service:
              - 'libs/common/**'
              - 'services/kitchen-service/**'
            delivery-service:
              - 'libs/common/**'
              - 'services/delivery-service/**'
            notification-service:
              - 'libs/common/**'
              - 'services/notification-service/**'
            load-generator:
              - 'libs/common/**'
              - 'services/load-generator/**'

  build:
    needs: detect-changes

    # Run if changes are detected OR if triggered manually via workflow_dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || (needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '') }}

    runs-on: ubuntu-24.04-arm # Native ARM64 runner (removes QEMU overhead)

    strategy:
      matrix:
        # Fall back to building all services on manual workflow_dispatch runs
        service: ${{ github.event_name == 'workflow_dispatch' && fromJson('["frontend-gateway","catalog-service","order-service","pricing-service","kitchen-service","delivery-service","notification-service","load-generator"]') || fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Enables advanced Docker features, like building for multiple architectures and better caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64 # build for ARM64 architecture
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optimized caching
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
